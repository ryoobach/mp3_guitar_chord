name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Add version to APK filename
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          APK_TARGET="app/build/outputs/apk/debug/Easy-MP3-Guitar-Chord-v${VERSION_NAME}.apk"
          test -f "$APK_SOURCE"
          mv "$APK_SOURCE" "$APK_TARGET"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-MP3-Guitar-Chord-v${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/debug/Easy-MP3-Guitar-Chord-v*.apk
          if-no-files-found: error
          retention-days: 14
